<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- =========================
       Navbar
  ========================== -->

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">
        Expense Tracker
      </span>
      <button id="darkModeToggle" class="btn btn-outline-light" type="button">
        🌙 Dark Mode
      </button>
    </div>
  </nav>


  <div class="container mt-4">

    <!-- Page Title -->
    <h1 class="mb-4">
      My Expenses
    </h1>

    <!-- =========================
         Error Alert
    ========================== -->

    <div id="error" class="alert alert-danger" style="display: none;"></div>
    <!-- Success Alert -->

    <div id="successMessage" class="alert alert-success d-none" role="alert"></div>
    <!-- =========================
         Summary Cards
    ========================== -->

    <div class="summary-grid mb-4">

      <div class="card text-center h-100">
        <div class="card-body">

          <h5 class="card-title">
            Total Amount
          </h5>

          <p id="totalAmount" class="fs-3 fw-bold">
            0.00
          </p>

        </div>
      </div>


      <div class="card text-center h-100">
        <div class="card-body">

          <h5 class="card-title">
            Number of Expenses
          </h5>

          <p id="expenseCount" class="fs-3 fw-bold">
            0
          </p>

        </div>
      </div>


      <div class="card text-center h-100">
        <div class="card-body">

          <h5 class="card-title">
            Highest Expense
          </h5>

          <p id="highestExpense" class="fs-3 fw-bold">
            0.00
          </p>

        </div>
      </div>

    </div>


    <!-- =========================
         Loading Spinner
    ========================== -->

    <div id="loading" class="text-center my-4" style="display: none;">

      <div class="spinner-border" role="status">
        <span class="visually-hidden">
          Loading...
        </span>
      </div>

    </div>




    <!-- =========================
     Add Expense Form
========================== -->

    <div class="card mb-4">
      <div class="card-body">
        <h3 class="mb-3">Add Expense</h3>

        <form id="expenseForm" novalidate>
          <div class="row g-3 align-items-start">

            <!-- Title -->
            <div class="col-lg-3 col-md-6">
              <label for="title" class="form-label">Title</label>
              <input type="text" id="title" class="form-control" placeholder="Enter expense title">
              <div id="titleError" class="invalid-feedback">
                Title is required.
              </div>
            </div>

            <!-- Amount -->
            <div class="col-lg-3 col-md-6">
              <label for="amount" class="form-label">Amount</label>
              <input type="number" id="amount" class="form-control" step="0.01" placeholder="Enter amount">
              <div id="amountError" class="invalid-feedback">
                Enter an amount greater than 0.
              </div>
            </div>

            <!-- Category -->
            <div class="col-lg-3 col-md-6">
              <label for="category" class="form-label">Category</label>
              <select id="category" class="form-select">
                <option value="">Choose category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div id="categoryError" class="invalid-feedback">
                Please select a category.
              </div>
            </div>

            <!-- Date -->
            <div class="col-lg-3 col-md-6">
              <label for="date" class="form-label">Date</label>
              <input type="date" id="date" class="form-control">
              <div id="dateError" class="invalid-feedback">
                Date is required.
              </div>
            </div>

            <!-- Submit Button -->
            <div class="col-12 mt-3">
              <button type="submit" class="btn btn-primary">
                Add expense
              </button>
            </div>

          </div>
        </form>
      </div>
    </div>

    <!-- =========================
     Expenses Table & Filter
========================== -->

    <div class="card mb-4">
      <div class="card-body">

        <!-- Header & Filter in one line -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Expenses</h3>

          <!-- Inline Filter -->
          <div class="d-flex align-items-center gap-2">
            <label for="categoryFilter" class="form-label mb-0 text-nowrap">
              Category
            </label>
            <select id="categoryFilter" class="form-select form-select-sm" style="width: auto;">
              <option value="All">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="expensesTableBody"></tbody>
          </table>
        </div>

      </div>
    </div>

    <!-- =========================
       EDIT MODAL
  ========================== -->

    <div class="modal fade" id="editExpenseModal" tabindex="-1" aria-hidden="true">

      <div class="modal-dialog">

        <div class="modal-content">

          <!-- Modal Header -->
          <div class="modal-header">

            <h5 class="modal-title">
              Edit Expense
            </h5>

            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

          </div>


          <!-- Modal Body -->
          <div class="modal-body">

            <form id="editExpenseForm">

              <!-- Hidden ID -->
              <input type="hidden" id="editId">


              <div class="mb-3">
                <label for="editTitle" class="form-label">Title</label>
                <input type="text" id="editTitle" class="form-control">
                <div id="editTitleError" class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <label for="editAmount" class="form-label">Amount</label>
                <input type="number" id="editAmount" class="form-control" step="0.01">
                <div id="editAmountError" class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <label for="editCategory" class="form-label">Category</label>
                <select id="editCategory" class="form-select">
                  <option value="">Select Category</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
                <div id="editCategoryError" class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <label for="editDate" class="form-label">Date</label>
                <input type="date" id="editDate" class="form-control">
                <div id="editDateError" class="invalid-feedback"></div>
              </div>
            </form>

          </div>


          <!-- Modal Footer -->
          <div class="modal-footer">

            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>

            <button type="button" id="saveEditButton" class="btn btn-primary">
              Save Changes
            </button>

          </div>

        </div>

      </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Our JavaScript -->
    <script src="js/app.js"></script>



</body>

</html>
